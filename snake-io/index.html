<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COIL — Snake.io</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="COIL game arena"></canvas>

      <header class="hud" id="hud" hidden>
        <div class="hud-brand">COIL</div>
        <div class="hud-stats">
          <span id="score">0</span>
          <span class="hud-sep">·</span>
          <span id="rank">#1</span>
        </div>
      </header>

      <aside class="leaderboard" id="leaderboard" hidden>
        <h2>Leaders</h2>
        <ol id="leader-list"></ol>
      </aside>

      <section class="screen" id="start-screen">
        <div class="screen-inner">
          <p class="eyebrow">arena mode</p>
          <h1 class="brand">COIL</h1>
          <p class="tagline">
            Steer with your mouse. Hold click or space to boost. Eat orbs, outgrow rivals, don’t crash.
          </p>
          <button type="button" class="cta" id="play-btn">Enter Arena</button>
          <p class="hint">Mouse to aim · Click / Space to boost</p>
        </div>
      </section>

      <section class="screen" id="over-screen" hidden>
        <div class="screen-inner">
          <p class="eyebrow">run ended</p>
          <h1 class="brand brand-sm">COIL</h1>
          <p class="tagline" id="over-message">You crashed.</p>
          <p class="final-score">Length <strong id="final-score">0</strong></p>
          <button type="button" class="cta" id="retry-btn">Coil Again</button>
        </div>
      </section>
    </div>
    <script src="game.js"></script>
  </body>
</html>
